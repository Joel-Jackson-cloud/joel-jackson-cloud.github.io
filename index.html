<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Course</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#eef1f4;--ink:#14202b;--mute:#5b6773;--line:#d3d9df;--accent:#0b5d8a}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1000px;margin:0 auto;padding:24px 16px}
h1{font-size:1.6rem;margin:0 0 16px}
input,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
input{width:100%;margin-bottom:10px;background:#fff}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7bb4d6}
#login{max-width:340px;margin:12vh auto}
#err{color:#b42318;min-height:1.5em}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:var(--mute);font-size:.9rem}
.top button{background:none;color:var(--ink);border-color:var(--line)}
.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
#list{list-style:none;margin:0;padding:0}
#list button{width:100%;text-align:left;background:#fff;color:var(--ink);border-color:var(--line);margin-bottom:6px}
#list button.on{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
#stage{position:relative;aspect-ratio:16/9;background:#0d1319;border-radius:8px;overflow:hidden;color:#cfd8df;display:grid;place-items:center}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wm{position:absolute;pointer-events:none;color:#fff;opacity:.22;font-size:.85rem;text-shadow:0 0 3px #000}
</style>
</head>
<body>
<main>
 <section id="login" hidden>
  <h1>Student login</h1>
  <form id="loginForm">
   <input id="email" type="email" placeholder="Email" autocomplete="username" required>
   <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
   <button>Log in</button>
   <p id="err" role="alert"></p>
  </form>
 </section>
 <section id="course" hidden>
  <div class="top"><span id="who"></span><button id="out">Log out</button></div>
  <h1>Course lessons</h1>
  <div class="layout">
   <ul id="list"></ul>
   <div id="stage"><span>Choose a lesson to start</span></div>
  </div>
 </section>
</main>
<script>
// Paste your Supabase values here (anon key is safe to be public)
const SUPABASE_URL = "https://dcjdtxnqnabxbrpagztj.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjamR0eG5xbmFieGJycGFnenRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUwNTU3MTEsImV4cCI6MjExMDYzMTcxMX0.NeSVGoN-Mah25PDMY2wsanTST1XsnAtfn148TBeaZS8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let email = "";

$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("err").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pw").value });
  if (error) { $("err").textContent = "Wrong email or password, or your access is off. Contact the course owner."; return; }
  showCourse(data.session);
};
$("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function showCourse(session) {
  email = session.user.email;
  $("login").hidden = true; $("course").hidden = false;
  $("who").textContent = email;
  const { data, error } = await sb.from("lessons").select("id,title").order("sort");
  if (error) { $("list").textContent = "Could not load lessons. Log in again."; return; }
  $("list").replaceChildren(...data.map(l => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.textContent = l.title; b.onclick = () => play(l.id, b);
    li.append(b); return li;
  }));
}

async function play(id, btn) {
  document.querySelectorAll("#list button").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  $("stage").textContent = "Loading…";
  const { data, error } = await sb.functions.invoke("get-video-url", { body: { lessonId: id } });
  if (error || !data?.url) { $("stage").textContent = "Could not load this video. Log in again."; return; }
  const f = document.createElement("iframe");
  f.src = data.url; f.allow = "autoplay; encrypted-media; picture-in-picture"; f.allowFullscreen = true;
  const w1 = document.createElement("div"), w2 = document.createElement("div");
  w1.className = w2.className = "wm"; w1.textContent = w2.textContent = email;
  w1.style.cssText = "top:12%;left:6%"; w2.style.cssText = "bottom:16%;right:6%";
  $("stage").replaceChildren(f, w1, w2);
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? showCourse(session) : ($("login").hidden = false);
})();
</script>
</body>
</html>
